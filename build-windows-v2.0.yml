name: Build JunBa AI Photo Classifier v2.0 Windows EXE
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build packages
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download YuNet
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -OutFile "face_detection_yunet_2023mar.onnx"
      - name: Download ArcFace recognition model
        shell: powershell
        run: |
          try {
            Invoke-WebRequest -Uri "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip" -OutFile "buffalo_l.zip"
          } catch {
            Invoke-WebRequest -Uri "https://sourceforge.net/projects/insightface.mirror/files/v0.7/buffalo_l.zip/download" -OutFile "buffalo_l.zip"
          }
          Expand-Archive -Path "buffalo_l.zip" -DestinationPath "buffalo_tmp" -Force
          $arc = Get-ChildItem -Path "buffalo_tmp" -Recurse -Filter "w600k_r50.onnx" | Select-Object -First 1
          if (-not $arc) { throw "Cannot find w600k_r50.onnx" }
          Copy-Item $arc.FullName ".\w600k_r50.onnx"
      - name: Prepare YOLOv8n ONNX
        shell: powershell
        run: |
          pip install ultralytics onnx
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt').export(format='onnx', imgsz=640, opset=12, simplify=False)"
          if (-not (Test-Path ".\yolov8n.onnx")) { throw "YOLOv8n ONNX export failed" }
      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "JunBa_AI_Photo_Classifier_v2.0" --collect-all pillow_heif --add-data "face_detection_yunet_2023mar.onnx;." --add-data "w600k_r50.onnx;." --add-data "yolov8n.onnx;." junba_ai_photo_v2.py
      - name: Package Portable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "portable" -Force | Out-Null
          Copy-Item "dist\JunBa_AI_Photo_Classifier_v2.0.exe" "portable\峻爸_AI智慧照片分類器_v2.0.exe"
          Copy-Item "README_v2.0.txt" "portable\README_v2.0.txt"
          Compress-Archive -Path "portable\*" -DestinationPath "峻爸_AI智慧照片分類器_v2.0_Windows_Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: JunBa-AI-Photo-Classifier-v2.0-Windows-Portable
          path: 峻爸_AI智慧照片分類器_v2.0_Windows_Portable.zip
          retention-days: 30
